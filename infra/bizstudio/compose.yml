# Bizstudio Recorder backend on vincenzoserver.
# Run: docker compose --env-file /root/bizstudio-recorder/secrets.env up -d
# Secrets and data live in BIZREC_DATA, never in this repo.
name: bizrec

x-secrets: &secrets
  env_file: ${BIZREC_DATA:-/root/bizstudio-recorder}/secrets.env

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  rclone:
    <<: [*secrets, *logging]
    image: rclone/rclone:1.74
    restart: unless-stopped
    # Serving the Storage Share over S3 lags ~5s on read-after-write, which is why
    # it only backs MinIO's cold tier and never receives Cap traffic directly.
    command: >
      serve s3 hetzner:BizStudio/Recorder --addr :9200
      --vfs-cache-mode writes --vfs-cache-max-size 5G --dir-cache-time 5s
      --cache-dir /cache
    environment:
      # Array flags read from env are parsed as CSV: the quotes keep key,secret one entry.
      RCLONE_AUTH_KEY: '"${TIER_S3_KEY},${TIER_S3_SECRET}"'
    volumes:
      - /root/.config/rclone:/config/rclone:ro
      - ${BIZREC_DATA:-/root/bizstudio-recorder}/rclone-cache:/cache

  minio:
    <<: *secrets
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    restart: unless-stopped
    command: server /data --console-address :9001
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    volumes:
      - ${BIZREC_DATA:-/root/bizstudio-recorder}/minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cap
      MYSQL_USER: cap
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --max_connections=200
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ${BIZREC_DATA:-/root/bizstudio-recorder}/mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "cap", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  brevo-relay:
    <<: *secrets
    build: ./brevo-relay
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8025/health"]
      interval: 30s

  media-server:
    build:
      context: ../../apps/media-server
      dockerfile: Dockerfile.standalone
    restart: unless-stopped
    <<: *logging
    mem_limit: 1g
    cpus: 2
    environment:
      PORT: 3456
      MEDIA_SERVER_WEBHOOK_SECRET: ${MEDIA_SERVER_WEBHOOK_SECRET}

  worker:
    <<: [*secrets, *logging]
    build: ./worker
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      POLL_SECONDS: 20
      BRAIN_REPO: git@github.com:xlagrangex/bizstudio-secondbrain.git
      BRAIN_BRANCH: ${WORKER_BRAIN_BRANCH:-main}
      GIT_SSH_COMMAND: ssh -i /run/brain_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/state/known_hosts
    volumes:
      - ${BIZREC_DATA:-/root/bizstudio-recorder}/worker-state:/state
      - /root/.ssh/id_ed25519_github:/run/brain_key:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/state/heartbeat') > 1800)"]
      interval: 60s
      start_period: 60s

  cap-web:
    image: ghcr.io/xlagrangex/cap-web:latest
    restart: unless-stopped
    <<: *logging
    mem_limit: 1g
    cpus: 1.5
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://cap:${MYSQL_PASSWORD}@mysql:3306/cap
      WEB_URL: https://rec.bizstudio.it
      NEXTAUTH_URL: https://rec.bizstudio.it
      DATABASE_ENCRYPTION_KEY: ${DATABASE_ENCRYPTION_KEY}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      MEDIA_SERVER_WEBHOOK_SECRET: ${MEDIA_SERVER_WEBHOOK_SECRET}
      CAP_AWS_ACCESS_KEY: ${MINIO_ROOT_USER}
      CAP_AWS_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      CAP_AWS_BUCKET: cap
      CAP_AWS_REGION: us-east-1
      S3_PUBLIC_ENDPOINT: https://media2.bizstudio.it
      S3_INTERNAL_ENDPOINT: http://minio:9000
      S3_PATH_STYLE: "true"
      RESEND_API_KEY: ${RELAY_TOKEN}
      RESEND_BASE_URL: http://brevo-relay:8025
      RESEND_FROM_DOMAIN: bizstudio.it
      CAP_ALLOWED_SIGNUP_DOMAINS: ${CAP_ALLOWED_SIGNUP_DOMAINS:-}
      MEDIA_SERVER_URL: http://media-server:3456
      MEDIA_SERVER_WEBHOOK_URL: http://cap-web:3000
    ports:
      - "127.0.0.1:3020:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
